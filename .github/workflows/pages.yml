name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/assets/images
          cp index.html styles.css script.js 404.html .nojekyll _site/
          cp -R blog people _site/
          cp \
            assets/images/monarda-brevis-cartoon-crop.svg \
            assets/images/monarda-brevis-cartoon-favicon.svg \
            assets/images/monarda-didyma-web.jpg \
            assets/images/monarda-eplingiana.jpg \
            assets/images/monarda-field.jpg \
            assets/images/monarda-reedii-web.jpg \
            assets/images/patrick1.jpg \
            assets/images/pedicularis-pollen.jpg \
            _site/assets/images/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
